name: CI

on:
  push:
    branches: [main]
  pull_request:
  # hassfest and HACS validate against rules that change upstream, so a repo
  # that has not been touched in a month can fail without a commit to blame.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

# Every action is pinned to a commit, because a moved tag would otherwise run
# unreviewed code. The trailing comment is the ref the SHA came from, and
# Dependabot bumps both together -- including hassfest and hacs/action, which
# track a branch rather than a release and would otherwise freeze here.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check custom_components tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: brands

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest tests -v
